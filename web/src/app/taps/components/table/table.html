<table class="TapsListTable-table">
  <thead>
  <tr>
    @for(column of columnNames; track column.name) {
      <th data-testid="table-header-colum">
        <button class="TapsListTable-tableHeaderButton"
                type="button"
                [attr.aria-label]="`Table header button for sorting ${column.text} ascending or descending `"
                (click)="onColumnSort(column.name, $event)">
            <span class="TapsListTable-tableHeaderButtonText">
              {{ column.text }}
            </span>

          @if(columnSort().direction !== 'none' && columnSort().column === column.name) {
            <span data-testid="table-header-colum-sort-icon" class="TapsListTable-tableHeaderSort">{{ (columnSort().direction === 'asc' ? '▲' : '▼') }}</span>
          }
        </button>
      </th>
    }
  </tr>
  </thead>
  <tbody>
    @if (isLoading) {
      <tr>
        @for(i of skeletons; track i) {
          <td><span class="TapsListTable-loader"></span></td>
        }
      </tr>
    }

    @for (row of data; track row.eventId) {
      <app-tap-row data-testid="row-data" [data]="row"></app-tap-row>
    } @empty {
      <tr>
        <td colspan="4"><span class="TapsListTable-noDataLabel">No data to display at the moment.</span></td>
      </tr>
    }
  </tbody>
</table>
