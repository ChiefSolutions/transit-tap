<div class="TapsListHeader-container">
  <app-icon name="bus" class="TapsListHeader-icon"></app-icon>
  <h1 class="TapsListHeader-heading">Transit Tap Event Stream</h1>
  <div class="TapsListHeader-liveIndicator"
       [class]="{
       'TapsListHeader--live': connected,
       'TapsListHeader--disconnected': !connected
     }">
    <span class="TapsListHeader-liveIndicatorLabel">{{connected ? 'Live stream' : 'Not connected'}}</span>
  </div>
</div>
